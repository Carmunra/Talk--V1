name: Publish platform
run-name: Publish ${{ inputs.environment }} from main
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_APPROVED: ${{ vars[format('{0}_RELEASE_APPROVED', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      STAGING_VALIDATED_SHA: ${{ vars.PRODUCTION_STAGING_VALIDATED_SHA }}
      GCP_PROJECT_ID: ${{ vars[format('{0}_GCP_PROJECT_ID', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      PEER_PROJECT_ID: ${{ vars[format('{0}_GCP_PROJECT_ID', inputs.environment == 'staging' && 'PRODUCTION' || 'STAGING')] }}
      GCP_REGION: ${{ vars[format('{0}_GCP_REGION', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      CLOUD_RUN_SERVICE: ${{ vars[format('{0}_CLOUD_RUN_SERVICE', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      ARTIFACT_REPOSITORY: ${{ vars[format('{0}_ARTIFACT_REPOSITORY', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      APP_ORIGIN: ${{ vars[format('{0}_APP_ORIGIN', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars[format('{0}_GCP_WORKLOAD_IDENTITY_PROVIDER', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars[format('{0}_GCP_DEPLOY_SERVICE_ACCOUNT', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      VITE_FIREBASE_API_KEY: ${{ vars[format('{0}_VITE_FIREBASE_API_KEY', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars[format('{0}_VITE_FIREBASE_PROJECT_ID', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars[format('{0}_VITE_FIREBASE_AUTH_DOMAIN', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
      VITE_FIREBASE_APP_ID: ${{ vars[format('{0}_VITE_FIREBASE_APP_ID', inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful CI on this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json headSha,headBranch,status,conclusion > /tmp/talke-ci.json
          node -e "const r=require('/tmp/talke-ci.json'); if(!r.some(x=>x.headSha===process.env.GITHUB_SHA && x.headBranch==='main' && x.status==='completed' && x.conclusion==='success')) process.exit(1)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: node --import tsx scripts/release.ts check
      - name: Build image for the actual Firebase project
        run: >-
          docker build --tag talke-release:local
          --build-arg VITE_FIREBASE_API_KEY
          --build-arg VITE_FIREBASE_PROJECT_ID
          --build-arg VITE_FIREBASE_AUTH_DOMAIN
          --build-arg VITE_FIREBASE_APP_ID .
      - run: npm run test:container -- talke-release:local
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: node --import tsx scripts/release.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-receipt-${{ inputs.environment }}-${{ github.run_id }}
          path: .release/receipt.json
          if-no-files-found: ignore
          retention-days: 30
