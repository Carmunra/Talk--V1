name: Production readiness
on:
  pull_request:
  push:
    branches: [main, codex/production-readiness]
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_PROJECT_ID: demo-talke
      VITE_FIREBASE_AUTH_DOMAIN: demo-talke.firebaseapp.com
      VITE_FIREBASE_APP_ID: demo-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.17.0'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run verify:lockfile
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:rules
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run verify:artifacts
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-evidence
          path: |
            coverage
            cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
