name: Production readiness
on:
  pull_request:
  push:
    branches: [main, codex/production-readiness]
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_PROJECT_ID: demo-talke
      VITE_FIREBASE_AUTH_DOMAIN: demo-talke.firebaseapp.com
      VITE_FIREBASE_APP_ID: demo-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflows
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck= .github/workflows/*.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.17.0'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run verify:lockfile
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/aws/tests/*.test.mjs
      - run: python3 -m unittest discover -s infra/aws/tests -p 'test_*.py' -v
      - run: npm run test:coverage
      - run: npm run test:rules
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run verify:artifacts
      - run: npm audit --audit-level=moderate
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - run: terraform -chdir=infra/cloud-run fmt -check -recursive
      - run: terraform -chdir=infra/cloud-run init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/cloud-run validate
      - run: terraform -chdir=infra/cloud-run test
      - run: terraform -chdir=infra/aws fmt -check -recursive
      - run: terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/aws validate
      - run: terraform -chdir=infra/aws test
      - name: Build production container
        run: >-
          docker build --tag talke-ci:local
          --build-arg VITE_FIREBASE_API_KEY
          --build-arg VITE_FIREBASE_PROJECT_ID
          --build-arg VITE_FIREBASE_AUTH_DOMAIN
          --build-arg VITE_FIREBASE_APP_ID .
      - run: npm run test:container
      - run: python3 scripts/aws/smoke-proxy.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-evidence
          path: |
            coverage
            cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
